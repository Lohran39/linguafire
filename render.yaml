services:
  - type: web
    name: linguafire
    runtime: node
    plan: free
    buildCommand: npm --prefix client ci --include=dev && npm --prefix server ci && npm run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TIMEOUT_MS
        value: 20000
      - key: SMTP_FORCE_IPV4
        value: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_MODEL_ALIAS
        value: gemini-3.6-flash
      - key: NATIVES_ADMIN_TOKEN
        generateValue: true
      - key: LYRICS_ADMIN_TOKEN
        generateValue: true
      - key: AGENT_ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_DASHBOARD_TOKEN
        generateValue: true
      - key: PUSH_ADMIN_TOKEN
        generateValue: true
